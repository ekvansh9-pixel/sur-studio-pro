<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="Sur Studio Logo">
  <defs>
    <!-- Teak Wood Gradient -->
    <linearGradient id="ssTeak" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="45%" stop-color="#8d3a08"/>
      <stop offset="100%" stop-color="#542104"/>
    </linearGradient>
    <!-- Brass / Gold Gradient for Sur S-Wave -->
    <linearGradient id="ssGold" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Warm Ivory Key Gradient -->
    <linearGradient id="ssIvory" x1="0" y1="14" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <!-- Soft Ambient Shadow -->
    <filter id="ssGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.8" stdDeviation="1.8" flood-color="rgba(15,23,42,0.45)"/>
    </filter>
  </defs>

  <!-- Teak Wood Housing Plaque -->
  <rect width="64" height="64" rx="15" fill="url(#ssTeak)"/>
  <!-- Polished Outer Bevel -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" stroke="rgba(255,255,255,0.24)" stroke-width="1.2"/>
  <!-- Traditional Indian Brass Inlay Border -->
  <rect x="3.25" y="3.25" width="57.5" height="57.5" rx="12" stroke="rgba(251,191,36,0.38)" stroke-width="0.8"/>

  <g filter="url(#ssGlow)">
    <!-- Harmonium Ivory White Keys (3 architectural reed keys) -->
    <rect x="16.5" y="15" width="8" height="34" rx="2" fill="url(#ssIvory)"/>
    <rect x="28" y="15" width="8" height="34" rx="2" fill="url(#ssIvory)"/>
    <rect x="39.5" y="15" width="8" height="34" rx="2" fill="url(#ssIvory)"/>

    <!-- Harmonium Ebony Black Keys (with brass edge accents) -->
    <!-- Black Key 1 -->
    <rect x="22.5" y="15" width="5.2" height="19" rx="1.5" fill="#0f172a"/>
    <rect x="22.5" y="15" width="5.2" height="19" rx="1.5" stroke="#f59e0b" stroke-width="0.7" fill="none"/>
    <path d="M 23.5 16 L 26.5 16" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Black Key 2 -->
    <rect x="36.3" y="15" width="5.2" height="19" rx="1.5" fill="#0f172a"/>
    <rect x="36.3" y="15" width="5.2" height="19" rx="1.5" stroke="#f59e0b" stroke-width="0.7" fill="none"/>
    <path d="M 37.3 16 L 40.3 16" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Melodic 'Sur' S-Curve (Classical Swara Wave connecting the registers) -->
    <path d="M 44.5 21.5 C 44.5 16, 37.5 15.5, 32 15.5 C 23.5 15.5, 18 19.5, 18 25.5 C 18 31.5, 25.5 32.5, 32 33.5 C 38.5 34.5, 46 36, 46 42.5 C 46 48.5, 39.5 50.5, 32 50.5 C 24.5 50.5, 18.5 47.5, 18.5 42.5" 
          stroke="url(#ssGold)" stroke-width="3.4" stroke-linecap="round" fill="none"/>

    <!-- Acoustic Free Reed Tongue Core (Center brass jewel) -->
    <circle cx="32" cy="33.5" r="3" fill="#ffffff"/>
    <circle cx="32" cy="33.5" r="1.8" fill="#b45309"/>
    
    <!-- Register Swara Accents (Upper & Lower resonance beads) -->
    <circle cx="38" cy="21.5" r="1.3" fill="#fef08a"/>
    <circle cx="26" cy="45.5" r="1.3" fill="#fef08a"/>
  </g>
</svg>