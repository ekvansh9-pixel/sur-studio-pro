<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52" fill="none">
  <defs>
    <linearGradient id="lkWood" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#8d3a08"/>
      <stop offset="100%" stop-color="#542104"/>
    </linearGradient>
    <linearGradient id="lkGold" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="lkIvory" x1="0" y1="10" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <!-- 48x48 Icon on the left -->
  <g transform="translate(2, 2)">
    <rect width="48" height="48" rx="12" fill="url(#lkWood)"/>
    <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <rect x="2.5" y="2.5" width="43" height="43" rx="9.5" stroke="rgba(251,191,36,0.35)" stroke-width="0.7"/>

    <!-- Keys -->
    <rect x="12.5" y="11" width="6" height="26" rx="1.5" fill="url(#lkIvory)"/>
    <rect x="21" y="11" width="6" height="26" rx="1.5" fill="url(#lkIvory)"/>
    <rect x="29.5" y="11" width="6" height="26" rx="1.5" fill="url(#lkIvory)"/>

    <rect x="17" y="11" width="4" height="14.5" rx="1.2" fill="#0f172a" stroke="#f59e0b" stroke-width="0.6"/>
    <rect x="27.2" y="11" width="4" height="14.5" rx="1.2" fill="#0f172a" stroke="#f59e0b" stroke-width="0.6"/>

    <!-- Sur S-Wave -->
    <path d="M 33.5 16 C 33.5 12, 28 11.5, 24 11.5 C 17.5 11.5, 13.5 14.5, 13.5 19 C 13.5 23.5, 19 24.5, 24 25.5 C 29 26.5, 34.5 27.5, 34.5 32.5 C 34.5 37, 29.5 38.5, 24 38.5 C 18 38.5, 14 36, 14 32" 
          stroke="url(#lkGold)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <circle cx="24" cy="25.5" r="2.2" fill="#ffffff"/>
    <circle cx="24" cy="25.5" r="1.3" fill="#b45309"/>
  </g>

  <!-- Typography on the right -->
  <text x="64" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="1.5" fill="#0f172a">SUR STUDIO</text>
  <text x="64" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.8" fill="#b45309" text-transform="uppercase">DIGITAL HARMONIUM &bull; METRONOME</text>
</svg>